		<script>
			function range_SVG() {
// 				First get range between two time-points:
				let start = parseInt(prompt("Enter the start time: "));
// 				We don't actually include the chord at 'end', but we stop there
				let end = parseInt(prompt("Enter the end time: "));
				logger.log("Start at "+start+" End at "+end);
				if(start >= end) {
					alert("End time must be greater than start time!")
					return
				}
				clearHilites(true);
				selectRange(start,end, "red", true);
			}				
			function hilite_by_beat(upbeat){
				var lasttime = 0;
				var end = 0;
				lasttime = clearHilites(false);
				
				let step = parseInt(prompt("Enter beat duration\n(Crotchet = 128) ","128"));
				colour = "red";
				var initial_start = get_firstChordTime(upbeat)
				var beat_skip = parseInt(initial_start/step)
				logger.log("beat_skip = "+ beat_skip)
				var start = initial_start;
				for(z=beat_skip;;z++) {
					if((start > z*step)) continue;
// 					start = z*step; end = start+step;
					end = start+step;
					logger.log(end - start)
					
					if(end > lasttime) return
					
					if(colour=="red") colour="green";
					else colour="red";
					selectRange(start, end, colour, false);
					start += step; 
				}
			}
			// returns object with first and last chord times
			function firstLastChordTimes(upbeat){
				var svg_element = document.getElementById("notation");
				var svg_children = svg_element.children;
				
				// only good for single chord upbeat!
				var upbeatcount = 0; 
				if(document.getElementById('upbeat_checkbox').checked == true) {
					logger.log("In firstLastChordTimes: "+upbeat)
					upbeatcount = 1;
					logger.log("In firstLastChordTimes: "+upbeatcount)
				}

// 				Get last chord ID/time
// 				var foundstart = false;
				var starttime = 0;
				var theID = "";
				var thetime = 0
				for(p=0;p<svg_children.length;p++) {
					var theclass = svg_children[p].getAttribute("class");
					
					if(theclass == "barline") continue;
					if(theclass == "chord editable") {
						if(upbeatcount == 0) {
							theID = svg_children[p].getAttribute("id");
							starttime = parseInt(theID.substring(6))
// 							foundstart = true;
							continue;
						}
						upbeatcount--;
						theID = svg_children[p].getAttribute("id");
						thetime = parseInt(theID.substring(6))
					}
				}
				logger.log(upbeat + "\n"+upbeatcount);
				logger.log("firsttime: "+starttime+"\nlasttime: "+ thetime);
				return {"firsttime": starttime, "lasttime": thetime}
			}
			function clearHilites(refreshTab)	{
				var end = 0;
				var svg_element = document.getElementById("notation");
				var svg_children = svg_element.children;
				
// 				Get last chord ID/time
				for(p=0;p<svg_children.length;p++) {
					var theID = svg_children[p].getAttribute("id");
					var theclass = svg_children[p].getAttribute("class");
					if(theclass == "chord editable") {
						var thetime = parseInt(theID.substring(6))
						end = thetime;
					}
// 					Clear hilites in this chord
					var items = svg_children[p].children
					for(q=0;q<items.length;q++) if( items[q].getAttribute("fill")) items[q].setAttribute("fill","black")
				}
				if(refreshTab) refresh();
				return end;
			}
						
			function sanitiseHTML(html) {
				var parser = new DOMParser();
				var parsedHtml = parser.parseFromString(html, "text/html");
				let tags = parsedHtml.querySelectorAll("svg");

				
			}
			
			function selectRange(start, end, colour,refreshTab) {
				var old_readonly = readonly;
				readonly = 1;
				var lasttime = 0;

				var svg_element = document.getElementById("notation");
				var svg_children = svg_element.children;
				
				var sel_array = [];
				var thetime = 0
				var systemcount = 0;
				var needID = false; // Need to complete prev ID with time-suffix
				for(p=0;p<svg_children.length;p++)	{

					var theclass = svg_children[p].getAttribute("class");
					switch(theclass) {
						case "Staves":
							// Use this to get suitable y-offset for next elements
							systemcount++;
							logger.log("Stave "+systemcount)
							var staffID = "staves-"+systemcount;
							sel_array.push({"id":staffID, "class":theclass,"svg":svg_children[p].outerHTML});				
							break;
						case "chord editable":
						case "chord readonly":
							// Get leftmost x as x-offset ?? Then increment by a space
							var theID = svg_children[p].getAttribute("id");
							thetime = parseInt(theID.substring(6))
							// Can only add time to barline ID when we know time of next chord!
							if(needID) {
								var barID = "barline-"+thetime;
								if(sel_array.length) sel_array[sel_array.length-1].id = barID;
// 								logger.log("Added time to barline at "+thetime)
								needID = false
							}
							if(thetime>end) break
							if(thetime >= start) {
// 								logger.log(theclass +" : "+ theID + " at time "+ thetime)
// 								var html =  "<html><body><svg>"+svg_children[p].outerHTML+"</svg></body></html>"
// 								sanitiseHTML(html); 
								sel_array.push({"id":theID,"class":theclass,"svg":svg_children[p].outerHTML});
							}
							break;
						case "barline":
							if(thetime>end) break
							if(thetime >= start) {
// 								logger.log(theclass +" : [no ID yet] at time "+ thetime)
// 								var html =  "<html><body><svg>"+svg_children[p].outerHTML+"</svg></body></html>"
// 								sanitiseHTML(html); 
								sel_array.push({"class":theclass,"svg":svg_children[p].outerHTML});
								needID = true;
							// Can only add time to barline ID when we know time of next chord! (See above under case "chord ...")
							}
							break;
					}
				}
				var svg_string = "";
				for(r=0;r<sel_array.length;r++) {
					if(sel_array[r].class.includes("chord")) { 
						document.getElementById(sel_array[r].id).setAttribute("fill",colour)
					}
					svg_string += sel_array[r].svg+"\n"
				}
				if(sel_array.length){
					logger.log(sel_array)
				}
				readonly = old_readonly;
			}
		</script>

	<script>

		// from: https://robkendal.co.uk/blog/2020-04-17-saving-text-to-client-side-file-using-vanilla-js
		function download() {
			const downloadToFile = (content, filename, contentType) => {
				const a = document.createElement('a');
				const file = new Blob([content], {type: contentType});
				a.href= URL.createObjectURL(file);
				a.download = filename;
				a.click();
				URL.revokeObjectURL(a.href);
			};
			const textArea = document.getElementById('code');
			var new_filename = prompt("New filename", "tabcode.tc");
			if (new_filename != null) {
				downloadToFile(textArea.value, new_filename, 'text/plain');
			}
			else {
				alert("No filename given! Try Again!");
			}		
		}
	</script>
